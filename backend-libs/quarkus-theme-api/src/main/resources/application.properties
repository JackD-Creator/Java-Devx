# Application
quarkus.application.name=quarkus-theme-api
quarkus.http.port=${APP_PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# DB_KIND  : postgresql | mariadb | mssql
# DB_URL examples:
#   PostgreSQL : jdbc:postgresql://localhost:5432/themedb
#   MariaDB    : jdbc:mariadb://localhost:3306/themedb
#   MSSQL      : jdbc:sqlserver://localhost:1433;databaseName=themedb;encrypt=false
quarkus.datasource.db-kind=${DB_KIND:postgresql}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/themedb}
quarkus.datasource.jdbc.max-size=${DB_MAX_POOL_SIZE:10}

# ── Flyway — pilih folder migration sesuai DB_KIND ───────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/${DB_KIND:postgresql}

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=Theme API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Enterprise Theme Management API

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Container image
quarkus.container-image.registry=${REGISTRY:ghcr.io}
quarkus.container-image.group=${REGISTRY_GROUP:enterprise}
quarkus.container-image.name=quarkus-theme-api
quarkus.container-image.tag=${VERSION:latest}

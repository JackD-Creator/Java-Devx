# Application
quarkus.application.name=quarkus-encryption
quarkus.http.port=${APP_PORT:8082}

# AES Encryption
# Generate key: AesEncryptionService.generateKey()
encryption.aes.key=${ENCRYPTION_AES_KEY:CHANGE_ME_32BYTE_BASE64_KEY_HERE=}

# RSA Encryption (optional)
encryption.rsa.key-size=${ENCRYPTION_RSA_KEY_SIZE:2048}
# encryption.rsa.public-key=${ENCRYPTION_RSA_PUBLIC_KEY}
# encryption.rsa.private-key=${ENCRYPTION_RSA_PRIVATE_KEY}

# BCrypt
encryption.bcrypt.cost=${ENCRYPTION_BCRYPT_COST:12}

# REST endpoint — set false to disable on production
encryption.endpoint.enabled=${ENCRYPTION_ENDPOINT_ENABLED:true}

# OpenAPI
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Encryption API
mp.openapi.extensions.smallrye.info.version=1.0.0

# Logging
quarkus.log.level=${LOG_LEVEL:INFO}

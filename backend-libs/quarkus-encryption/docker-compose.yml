version: "3.9"

services:
  encryption:
    build: .
    ports:
      - "${APP_PORT:-8082}:8082"
    environment:
      ENCRYPTION_AES_KEY: ${ENCRYPTION_AES_KEY}
      ENCRYPTION_BCRYPT_COST: ${ENCRYPTION_BCRYPT_COST:-12}
      ENCRYPTION_ENDPOINT_ENABLED: ${ENCRYPTION_ENDPOINT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

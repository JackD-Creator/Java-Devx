# Application
quarkus.application.name=quarkus-db-adapter
quarkus.http.port=${APP_PORT:8081}

# ── Database ──────────────────────────────────────────────────────────────────
# DB_KIND  : postgresql | mariadb | mssql
# DB_URL examples:
#   PostgreSQL : jdbc:postgresql://localhost:5432/appdb
#   MariaDB    : jdbc:mariadb://localhost:3306/appdb
#   MSSQL      : jdbc:sqlserver://localhost:1433;databaseName=appdb;encrypt=false
quarkus.datasource.db-kind=${DB_KIND:postgresql}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
quarkus.datasource.jdbc.max-size=${DB_MAX_POOL_SIZE:10}
quarkus.datasource.jdbc.min-size=${DB_MIN_POOL_SIZE:2}
quarkus.datasource.jdbc.acquisition-timeout=30

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ── Hibernate ─────────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=${DB_LOG_SQL:false}
quarkus.hibernate-orm.log.bind-parameters=${DB_LOG_SQL:false}

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.always-include=true

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."com.enterprise".level=DEBUG

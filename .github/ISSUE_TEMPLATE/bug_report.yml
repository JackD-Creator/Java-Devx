name: Bug Report
description: Laporkan bug atau perilaku yang tidak diharapkan
title: "fix(<scope>): "
labels: ["bug", "triage"]

body:
  - type: dropdown
    id: module
    attributes:
      label: Modul
      description: Modul mana yang bermasalah?
      options:
        - quarkus-db-adapter
        - quarkus-encryption
        - quarkus-theme-api
        - nuxt-ui-lib
        - nuxt-composables
        - nuxt-theme-lib
        - Docker / Infrastruktur
        - Lainnya
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Deskripsi Bug
      description: Jelaskan bug secara singkat dan jelas
      placeholder: "Ketika saya melakukan X, terjadi Y padahal seharusnya Z"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Langkah Reproduksi
      description: Langkah-langkah untuk mereproduksi bug
      placeholder: |
        1. Jalankan `docker compose up -d`
        2. Buka http://localhost:8080/api/themes
        3. Lihat error di console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang Diharapkan
      description: Apa yang seharusnya terjadi?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Perilaku Aktual
      description: Apa yang sebenarnya terjadi?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Informasi environment saat bug terjadi
      value: |
        - OS: Windows / macOS / Linux
        - Java: 21.x.x
        - Node.js: 18.x.x
        - Docker: 24.x.x
        - Browser (jika frontend): Chrome / Firefox
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log / Stack Trace
      description: Tempelkan log error jika ada
      render: shell
